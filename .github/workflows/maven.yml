name: Pipeline

on:
  # Nur die beiden Stage-Zweige loesen ueber push aus. Alles andere laeuft
  # ueber pull_request - sonst liefe jeder PR doppelt, einmal fuer den Push
  # auf den Branch und einmal fuer den PR selbst.
  push:
    branches: [master, dev]
  pull_request:
  workflow_dispatch:

# Schiebt jemand zweimal kurz hintereinander, wird der erste Lauf abgebrochen.
# Bisher liefen beide zu Ende und das Ergebnis des aelteren kam zuletzt an.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '25'
  JAVA_DISTRIBUTION: corretto
  NODE_VERSION: '24'
  PNPM_VERSION: '11'
  IMAGE: ${{ vars.DOCKER_HUB_USERNAME }}/myfinance

jobs:
  be:
    name: Backend bauen und testen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      # verify testet und paketiert in einem Lauf. Vorher liefen dafuer zwei
      # Jobs, die beide von vorn gebaut haben.
      - name: Test und Paket
        run: |
          cd be
          mvn -B verify

      - uses: actions/upload-artifact@v4
        with:
          name: be-jar
          path: be/target/*.jar
          retention-days: 1

  fe:
    name: Frontend bauen und testen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: fe/pnpm-lock.yaml

      - name: Abhaengigkeiten
        run: |
          cd fe
          pnpm install --frozen-lockfile

      - name: Tests
        run: |
          cd fe
          pnpm test

      # Ein Build fuer alle Stages - die Domain steckt seit Luna/41 nicht mehr
      # im Artefakt.
      - name: Build
        run: |
          cd fe
          pnpm run build

      - uses: actions/upload-artifact@v4
        with:
          name: fe-dist
          path: fe/dist
          retention-days: 1

  publish:
    name: Images veroeffentlichen
    needs: [be, fe]
    # Nur die Stage-Zweige erzeugen Images. Vorher schob jeder beliebige
    # Branch sein Ergebnis nach :be-test und ueberschrieb damit den Stand,
    # auf dem dev gerade lief.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: be-jar
          path: be/target

      - uses: actions/download-artifact@v4
        with:
          name: fe-dist
          path: fe/dist

      # Die SHA ist die Wahrheit, der Zeiger ist bequem. :latest zeigt auf
      # prod, :dev auf die Integrationsstage.
      - name: Tags bestimmen
        id: tags
        run: |
          sha="${GITHUB_SHA::12}"
          if [ "${GITHUB_REF#refs/heads/}" = "master" ]; then
            pointer="latest"
          else
            pointer="dev"
          fi
          echo "sha=$sha"         >> "$GITHUB_OUTPUT"
          echo "pointer=$pointer" >> "$GITHUB_OUTPUT"
          echo "Unveraenderlich: $IMAGE:be-$sha / $IMAGE:fe-$sha"
          echo "Zeiger:          $IMAGE:be-$pointer / $IMAGE:fe-$pointer"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Backend-Image
        run: |
          docker build be \
            -t "$IMAGE:be-${{ steps.tags.outputs.sha }}" \
            -t "$IMAGE:be-${{ steps.tags.outputs.pointer }}"
          docker push "$IMAGE:be-${{ steps.tags.outputs.sha }}"
          docker push "$IMAGE:be-${{ steps.tags.outputs.pointer }}"

      - name: Frontend-Image
        run: |
          docker build fe \
            -t "$IMAGE:fe-${{ steps.tags.outputs.sha }}" \
            -t "$IMAGE:fe-${{ steps.tags.outputs.pointer }}"
          docker push "$IMAGE:fe-${{ steps.tags.outputs.sha }}"
          docker push "$IMAGE:fe-${{ steps.tags.outputs.pointer }}"

  dockerhub-description:
    name: Dockerhub-Beschreibung
    needs: publish
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
          repository: ${{ env.IMAGE }}
          readme-filepath: ./README.md
