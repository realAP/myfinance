# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/example
spring.datasource.username=example
spring.datasource.password=example
# Application
server.port=8080
app.security.user.username=user
app.security.user.password=password
# Schema
spring.flyway.enabled=true
# Die Datenbank existiert unter Umstaenden schon und traegt keine
# flyway_schema_history - dann wird V1 als erledigt markiert statt ausgefuehrt.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
