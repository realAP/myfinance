# Hibernate veraendert das Schema nicht mehr selbst - Flyway ist dafuer
# zustaendig, Hibernate prueft nur noch gegen die Entities.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.profiles.active=${SPRING_PROFILE:local}

# Die Migrationen sind PostgreSQL-Syntax. Flyway wird deshalb dort
# eingeschaltet, wo eine PostgreSQL-Datenbank steht - in den Profilen local
# und prod - und bleibt hier grundsaetzlich aus. Die Tests laufen auf H2 und
# bauen ihr Schema weiterhin selbst; ein @DataJpaTest ohne Profil wuerde die
# Migrationen sonst gegen H2 ausfuehren und daran scheitern.
spring.flyway.enabled=false
