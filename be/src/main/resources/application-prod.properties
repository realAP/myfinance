# Database
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
# Application
app.security.user.username=${APP_USER}
app.security.user.password=${APP_PASSWORD}

# Schema
spring.flyway.enabled=true
# Die Datenbank existiert unter Umstaenden schon und traegt keine
# flyway_schema_history - dann wird V1 als erledigt markiert statt ausgefuehrt.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
