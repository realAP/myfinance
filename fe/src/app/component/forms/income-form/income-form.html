<p>income-form works!</p>

<div class="card flex flex-column md:flex-row gap-3">
  <div class="input-group">
    <p-floatlabel>
      <input id="name" type="text" pInputText
             [(ngModel)]="description"
      />
      <label for="name">Name</label>
    </p-floatlabel>
  </div>

  <div class="input-group">
    <p-inputgroup>
      <p-floatlabel>
        <p-inputnumber
          [(ngModel)]="amount"
          id="minmaxfraction"
          mode="decimal"
          [allowEmpty]="true"
          [minFractionDigits]="2"
        />
        <label for="minmaxfraction">Betrag</label>
      </p-floatlabel>
      <p-inputgroup-addon>€</p-inputgroup-addon>
    </p-inputgroup>
  </div>

  <div class="input-group">
    <p-button label="Submit" (click)="onClick()"/>
  </div>

</div>
